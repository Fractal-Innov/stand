# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Liste blanche (30/09/2026) : seuls les fichiers du site partent en ligne.
      # Jekyll publiait tout le dépôt, dont VENTE.md (fiche de vente, journal),
      # CLAUDE.md et docs/ ; un nouveau fichier de travail ne sera jamais publié
      # par accident. Un fichier ajouté au site doit être ajouté ici.
      - name: Assemble the site (allowlist)
        run: |
          mkdir -p _site
          cp -R index.html favicon.ico site.webmanifest assets _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          echo "Publié :" && ls -A _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
